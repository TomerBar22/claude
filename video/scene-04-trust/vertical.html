<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene 4 – Trust Points (9:16)</title>
<!--
  Vertical 1080x1920 cut for social / ads. 14s total:
     0.0– 2.5s  intro: logo + "Your Patio's Golden Age Starts Now"
     2.5– 5.0s  photo 1 · "Licensed & insured"
     5.0– 7.5s  photo 2 · "Built by our own crews"
     7.5–10.0s  photo 3 · "Free estimates"
    10.0–14.0s  offer: $500 off any patio cover, this fall only

  Brand (Golden Patio Restoration guidelines, 2026): charcoal #3D3527,
  gold #B18B2E, light gold #D8B55B, teal #6BC0C0, ivory #FAF7F5.
  Headlines in Playfair Display, supporting text in Jost. The logo is the
  supplied reversed lockup (assets/), never retyped.

  ?t=3.5 freezes at 3.5s · ?render=1 hides controls for frame capture.
  Text is kept out of the top ~12% and bottom ~20% where Reels/TikTok UI sits.
-->
<style>
  @font-face {
    font-family: "Playfair Display";
    src: url("assets/fonts/PlayfairDisplay-latin.woff2") format("woff2");
    font-weight: 400 900;
    font-display: block;
  }
  @font-face {
    font-family: "Jost";
    src: url("assets/fonts/Jost-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --charcoal: #3d3527;
    --gold: #b18b2e;
    --light-gold: #d8b55b;
    --teal: #6bc0c0;
    --ivory: #faf7f5;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body { display: grid; place-items: center; }

  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--charcoal);
    overflow: hidden;
    transform-origin: center;
    flex: none;
  }

  /* diagonal plank pattern, echoing the roof stripes in the mark */
  .planks {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -35deg,
      rgba(216,181,91,.07) 0 90px,
      transparent 90px 190px
    );
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.35) 55%, transparent 80%);
            mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.35) 55%, transparent 80%);
  }

  /* ---------- intro ---------- */
  .intro {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 80px;
    padding: 0 80px 100px;
    animation: fade-out 350ms linear 2300ms forwards;
  }
  .intro .logo {
    position: relative;
    width: 640px;
    opacity: 0;
    transform: scale(.9);
    animation: pop-in 700ms cubic-bezier(.2,.8,.2,1) 150ms forwards;
  }
  .headline {
    position: relative;
    color: var(--ivory);
    font: 700 104px/1.08 var(--serif);
    text-align: center;
  }
  .headline span {
    display: block;
    opacity: 0;
    transform: translateY(40px);
    animation: rise-in 600ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .headline span:nth-child(1) { animation-delay: 550ms; }
  .headline span:nth-child(2) { animation-delay: 750ms; color: var(--light-gold); }
  .headline span:nth-child(3) { animation-delay: 950ms; }

  /* ---------- photo slides ---------- */
  .slide {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    animation: fade-in 400ms linear forwards;
  }
  .slide.s1 { animation-delay: 2300ms; z-index: 2; }
  .slide.s2 { animation-delay: 4800ms; z-index: 3; }
  .slide.s3 { animation-delay: 7300ms; z-index: 4; }

  .photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    animation: ken-burns 2900ms linear forwards;
  }
  .slide.s1 .photo { animation-delay: 2300ms; }
  .slide.s2 .photo { animation-delay: 4800ms; }
  .slide.s3 .photo { animation-delay: 7300ms; }

  .placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.35);
    font: 500 40px var(--sans);
    text-transform: uppercase;
    background: linear-gradient(160deg, #4a4232, #2b251b);
  }

  /* charcoal wash on the lower half so the caption always reads */
  .slide::after {
    content: "";
    position: absolute;
    inset: 45% 0 0 0;
    background: linear-gradient(to bottom, transparent, rgba(61,53,39,.88) 55%);
  }

  .caption {
    position: absolute;
    left: 70px; right: 70px;
    bottom: 430px;              /* clear of the bottom ~20% social UI */
    z-index: 1;
    color: var(--ivory);
    font: 700 96px/1.05 var(--serif);
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    animation: rise-in 550ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .caption::before {
    content: "";
    display: block;
    width: 110px;
    height: 8px;
    margin: 0 auto 36px;
    background: linear-gradient(90deg, var(--gold), var(--light-gold));
  }
  .slide.s1 .caption { animation-delay: 2650ms; }
  .slide.s2 .caption { animation-delay: 5150ms; }
  .slide.s3 .caption { animation-delay: 7650ms; }

  /* gold badge (the guide's small-size mark) over the photos */
  .badge {
    position: absolute;
    top: 250px;
    left: 50%;
    width: 150px;
    margin-left: -75px;
    z-index: 5;
    opacity: 0;
    animation: fade-in 400ms linear 2500ms forwards;
  }

  /* ---------- offer ---------- */
  .offer {
    position: absolute;
    inset: 0;
    z-index: 6;
    background: var(--charcoal);
    opacity: 0;
    animation: fade-in 400ms linear 9800ms forwards;
  }
  .offer-body {
    position: absolute;
    left: 0; right: 0;
    top: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .offer-body > * {
    opacity: 0;
    transform: translateY(30px);
    animation: rise-in 550ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .offer .logo    { width: 480px; animation-delay: 10000ms; }
  .offer .rule    { width: 72px; height: 4px; margin: 36px 0 44px; background: var(--gold); animation-delay: 10250ms; }
  .offer .kicker  { color: var(--teal); font: 600 36px var(--sans); letter-spacing: .3em; margin-right: -.3em; animation-delay: 10350ms; }
  .offer .amount  {
    margin-top: 30px;
    color: var(--ivory);
    font: 800 190px/1 var(--serif);
    font-variant-numeric: lining-nums;
    letter-spacing: -.01em;
    transform: scale(.8);
    animation: pop-in 650ms cubic-bezier(.2,1.3,.3,1) 10500ms forwards;
  }
  .offer .what    { margin-top: 18px; color: var(--light-gold); font: 700 74px/1.1 var(--serif); animation-delay: 10750ms; }
  .offer .pill    {
    margin-top: 44px;
    padding: 18px 44px;
    white-space: nowrap;
    border: 3px solid var(--teal);
    border-radius: 999px;
    color: var(--teal);
    font: 600 34px var(--sans);
    letter-spacing: .22em;
    animation-delay: 11000ms;
  }
  .offer .pill span { margin-right: -.22em; }
  .offer .blurb   { margin-top: 44px; max-width: 800px; color: var(--ivory); font: 500 40px/1.35 var(--sans); animation-delay: 11150ms; }
  .offer .cta     {
    margin-top: 48px;
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 34px 64px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--gold), var(--light-gold));
    color: var(--charcoal);
    font: 600 70px/1 var(--sans);
    animation: rise-in 550ms cubic-bezier(.2,.8,.2,1) 11350ms forwards,
               nudge 700ms ease-in-out 12600ms 1;
  }
  .offer .cta svg { width: 62px; height: 62px; flex: none; }
  .offer .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 14px;
    background: linear-gradient(90deg, var(--gold), var(--light-gold), var(--gold));
  }

  @keyframes fade-in   { to { opacity: 1; } }
  @keyframes fade-out  { to { opacity: 0; } }
  @keyframes pop-in    { to { opacity: 1; transform: none; } }
  @keyframes rise-in   { to { opacity: 1; transform: none; } }
  @keyframes ken-burns { from { transform: scale(1.0); } to { transform: scale(1.1); } }
  @keyframes nudge     { 0%, 100% { transform: none; } 50% { transform: scale(1.05); } }

  .controls {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: #fff;
    font: 14px/1 ui-monospace, Menlo, monospace;
    backdrop-filter: blur(6px);
  }
  .controls button {
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    background: #fff;
    color: #000;
    font: inherit;
    cursor: pointer;
  }
  .controls input { width: min(300px, 50vw); }
  body.render .controls { display: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="planks"></div>

    <div class="intro">
      <img class="logo" src="assets/logo-reversed-transparent.png" alt="Golden Patio Restoration">
      <h1 class="headline">
        <span>Your Patio's</span>
        <span>Golden Age</span>
        <span>Starts Now</span>
      </h1>
    </div>

    <div class="slide s1" data-photo="photos/1.jpg" data-label="Photo 1">
      <div class="photo"></div>
      <div class="caption">Licensed &amp; insured</div>
    </div>
    <div class="slide s2" data-photo="photos/2.jpg" data-label="Photo 2">
      <div class="photo"></div>
      <div class="caption">Built by our own crews</div>
    </div>
    <div class="slide s3" data-photo="photos/3.jpg" data-label="Photo 3">
      <div class="photo"></div>
      <div class="caption">Free estimates</div>
    </div>

    <img class="badge" src="assets/logo-badge.png" alt="">

    <div class="offer">
      <div class="planks"></div>
      <div class="offer-body">
        <img class="logo" src="assets/logo-reversed-transparent.png" alt="Golden Patio Restoration">
        <div class="rule"></div>
        <div class="kicker">PATIO COVERS</div>
        <div class="amount">$500 OFF</div>
        <div class="what">ANY PATIO COVER</div>
        <div class="pill"><span>THIS FALL ONLY</span></div>
        <p class="blurb">Solid &amp; insulated patio covers, custom built with roof mounts.</p>
        <div class="cta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
          </svg>
          (818) 961-1284
        </div>
      </div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="controls">
    <button id="play">Pause</button>
    <input id="scrub" type="range" min="0" max="14000" step="10" value="0">
    <span id="clock">0.00s</span>
  </div>

<script>
  const SCENE_MS = 14000;
  const params = new URLSearchParams(location.search);
  const stage = document.getElementById('stage');

  document.querySelectorAll('.slide').forEach(slide => {
    const photo = slide.querySelector('.photo');
    const img = new Image();
    img.onload = () => { photo.style.backgroundImage = `url("${slide.dataset.photo}")`; };
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = slide.dataset.label;
      photo.appendChild(ph);
    };
    img.src = slide.dataset.photo;
  });

  function fit() {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  const anims = () => stage.getAnimations({ subtree: true });
  const clock = document.getElementById('clock');
  const scrub = document.getElementById('scrub');
  const playBtn = document.getElementById('play');
  let playing = true;
  const start = performance.now();

  function seek(sec) {
    const ms = Math.max(0, Math.min(SCENE_MS, sec * 1000));
    anims().forEach(a => { a.pause(); a.currentTime = ms; });
    show(ms);
  }
  function show(ms) {
    scrub.value = ms;
    clock.textContent = (ms / 1000).toFixed(2) + 's';
  }
  window.seek = seek;

  // Scene clock while playing: every animation shares the same start time.
  let t0 = start;
  playBtn.onclick = () => {
    if (playing) {
      anims().forEach(a => a.pause());
    } else {
      const t = +scrub.value >= SCENE_MS ? 0 : +scrub.value;
      anims().forEach(a => { a.currentTime = t; a.play(); });
      t0 = performance.now() - t;
    }
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
  };
  scrub.oninput = () => {
    playing = false;
    playBtn.textContent = 'Play';
    seek(scrub.value / 1000);
  };
  (function tick() {
    if (playing) show(Math.min(SCENE_MS, performance.now() - t0));
    requestAnimationFrame(tick);
  })();

  if (params.has('render')) document.body.classList.add('render');
  if (params.has('t')) { playing = false; playBtn.textContent = 'Play'; seek(parseFloat(params.get('t'))); }
</script>
</body>
</html>
